- type: Backend
  id: API-POST-ValidateUsername
  route: POST /api/v1/auth/register/validate-username
  description: 注册第一步：校验用户名是否存在。
  input:
    type: JSON
    body:
      username: string
  output:
    success:
      statusCode: 200
      body: { valid: true, message: "Username available" }
    error:
      - statusCode: 409
        body: { valid: false, error: "该用户名已经占用，请重新选择用户名！" }
  dependencies:
    - DB-FindUserByUsername
  acceptanceCriteria:
    - 检查用户名是否已存在。
  changeLog:
    - date: "2025-12-08"
      description: "新增接口以支持分步注册校验。"

- type: Backend
  id: API-POST-ValidatePhone
  route: POST /api/v1/auth/register/validate-phone
  description: 注册校验：校验手机号是否已被绑定。
  input:
    type: JSON
    body:
      phone: string
  output:
    success:
      statusCode: 200
      body: { valid: true }
    error:
      - statusCode: 409
        body: { valid: false, error: "手机号已被注册" }
  dependencies:
    - DB-FindUserByPhone
  acceptanceCriteria:
    - 检查手机号唯一性。
  changeLog:
    - date: "2025-12-08"
      description: "新增接口。"

- type: Backend
  id: API-POST-ValidateEmail
  route: POST /api/v1/auth/register/validate-email
  description: 注册校验：校验邮箱是否已被绑定。
  input:
    type: JSON
    body:
      email: string
  output:
    success:
      statusCode: 200
      body: { valid: true }
    error:
      - statusCode: 409
        body: { valid: false, error: "邮箱已被注册" }
  dependencies:
    - DB-FindUserByEmail
  acceptanceCriteria:
    - 检查邮箱唯一性。
  changeLog:
    - date: "2025-12-08"
      description: "新增接口。"

- type: Backend
  id: API-POST-StartRegistration
  route: POST /api/v1/auth/register
  description: 启动注册流程 (第一步)。验证表单数据并返回会话ID。
  input:
    type: JSON
    body:
      username: string
      password: string
      email: string
      mobile: string
      name: string
      id_type: string
      id_no: string
  output:
    success:
      statusCode: 200
      body: { sessionId: "uuid", message: "Registration started" }
    error:
      - statusCode: 400
        body: { error: "Validation failed" }
      - statusCode: 409
        body: { error: "User already exists" }
  dependencies:
    - Cache-StoreRegistrationSession
  acceptanceCriteria:
    - 接收用户注册信息，进行格式和唯一性校验。
    - 校验通过后，将数据暂存 (如 Redis) 并返回 sessionId。
    - 不创建数据库记录。
  changeLog:
    - date: "2025-12-08"
      description: "修改为分步注册的第一步，返回 sessionId 而非 userId。"
    - date: "2025-11-28"
      description: "初始创建。"

- type: Backend
  id: API-POST-SendRegisterSMS
  route: POST /api/v1/auth/register/send-verification-code
  description: 发送注册验证码 (第二步，支持短信/邮箱)。
  input:
    type: JSON
    body:
      sessionId: string
      phone: string # or email
  output:
    success:
      statusCode: 200
      body: { message: "Verification code sent", verificationCode: "123456" } # verificationCode for dev only
    error:
      - statusCode: 400
        body: { error: "Invalid session or phone mismatch" }
  dependencies:
    - Cache-GetRegistrationSession
    - SMS-Service
  acceptanceCriteria:
    - 验证 sessionId 有效性。
    - 发送验证码。
  changeLog:
    - date: "2025-12-08"
      description: "新增接口。"

- type: Backend
  id: API-POST-CompleteRegistration
  route: POST /api/v1/auth/register/complete
  description: 完成注册 (第三步)。验证短信码并创建用户。
  input:
    type: JSON
    body:
      sessionId: string
      smsCode: string
  output:
    success:
      statusCode: 201
      body: { userId: "uuid", message: "Registration successful" }
    error:
      - statusCode: 400
        body: { error: "Invalid code or session expired" }
  dependencies:
    - Cache-GetRegistrationSession
    - DB-CreateUser
  acceptanceCriteria:
    - 验证短信验证码。
    - 从缓存恢复注册数据。
    - 在数据库创建用户。
    - 密码哈希处理。
  changeLog:
    - date: "2025-12-08"
      description: "新增接口。"

- type: Backend
  id: API-POST-Login
  route: POST /api/v1/auth/login
  description: 用户登录接口，建立会话 (支持二步验证)。
  input:
    type: JSON
    body:
      username: string
      password: string
      sms_code: string
  output:
    success:
      statusCode: 200
      body: { user: object } # Sets sid cookie
    error:
      - statusCode: 401
        body: { error: "用户名或密码错误" } # 或验证码错误
  dependencies:
    - DB-FindUserByCredential
  acceptanceCriteria:
    - 验证用户名、密码和短信验证码。
    - 失败时返回统一模糊错误提示以防枚举。
    - 成功时设置 HTTP-Only Cookie (sid)。
  changeLog:
    - date: "2025-12-08"
      description: "更新为二步验证登录，增加 sms_code 字段。"
    - date: "2025-11-28"
      description: "初始创建。"

- type: Backend
  id: API-POST-SendLoginSMS
  route: POST /api/v1/auth/send-sms
  description: 发送登录验证码 (二步验证第一步)。
  input:
    type: JSON
    body:
      username: string
      id_card_last_4: string
  output:
    success:
      statusCode: 200
      body: { message: "SMS sent successfully" }
    error:
      - statusCode: 400
        body: { error: "请输入正确的用户信息" }
  dependencies:
    - DB-FindUserByCredential
  acceptanceCriteria:
    - 校验证件号后4位是否匹配。
    - 无论用户是否存在或匹配失败，均返回统一错误提示。
  changeLog:
    - date: "2025-12-08"
      description: "新增接口。"

- type: Backend
  id: API-GET-Passengers
  route: GET /api/v1/passengers
  description: 获取当前登录用户的乘车人列表。
  input:
    type: None
  output:
    success:
      statusCode: 200
      body: [ { id, name, card_type, card_no, type } ]
    error:
      - statusCode: 401
        body: { error: "Unauthorized" }
  dependencies:
    - DB-FindPassengersByUser
  acceptanceCriteria:
    - 仅返回属于当前会话用户的乘车人。
  changeLog:
    - date: "2025-11-28"
      description: "初始创建。"

- type: Backend
  id: API-POST-Passengers
  route: POST /api/v1/passengers
  description: 添加新的乘车人。
  input:
    type: JSON
    body:
      name: string
      card_type: string
      card_no: string
      type: string
  output:
    success:
      statusCode: 201
      body: { id: "uuid" }
    error:
      - statusCode: 400
        body: { error: "Limit reached (15)" }
      - statusCode: 409
        body: { error: "Passenger already exists" }
  dependencies:
    - DB-CreatePassenger
    - DB-FindPassengersByUser # Check limit
  acceptanceCriteria:
    - 检查乘车人数量上限 (15)。
    - 检查重复添加。
  changeLog:
    - date: "2025-11-28"
      description: "初始创建。"

- type: Backend
  id: API-GET-TrainSearch
  route: GET /api/v1/trains/search
  description: 查询车次及余票信息。
  input:
    type: Query
    params:
      fromStationId: uuid
      toStationId: uuid
      date: string (YYYY-MM-DD)
  output:
    success:
      statusCode: 200
      body: [ { trainNo, initialDepartureStation, finalArrivalStation, seats: [ { type, left, bookable } ] } ]
  dependencies:
    - DB-SearchTrains
  acceptanceCriteria:
    - 返回符合条件的车次列表。
    - 包含各席别的实时库存。
    - 返回该车次的真实始发站和终点站信息。
  changeLog:
    - date: "2025-12-20"
      description: "新增 initialDepartureStation 和 finalArrivalStation 字段，用于前端正确显示始/终/过标识。"
    - date: "2025-11-28"
      description: "初始创建。"

- type: Backend
  id: API-GET-OrderInfo
  route: GET /api/v1/orders/new
  description: 获取订单填写页所需信息（车次、余票、票价、常用联系人）。
  input:
    type: Query
    params:
      trainNo: string
      departureStation: string
      arrivalStation: string
      departureDate: string
  output:
    success:
      statusCode: 200
      body:
        trainInfo: object
        fareInfo: object
        availableSeats: object
        passengers: array
        defaultSeatType: string
    error:
      - statusCode: 400
        body: { error: "Missing parameters" }
      - statusCode: 404
        body: { error: "Train service not found" }
  dependencies:
    - DB-SearchTrains
    - DB-FindPassengersByUser
  acceptanceCriteria:
    - 返回车次详情、座位库存及价格。
    - 返回当前用户的常用联系人。
  changeLog:
    - date: "2025-12-20"
      description: "接口实现完善：集成票价查询、座位库存检查及乘车人列表加载。"
    - date: "2025-12-15"
      description: "新增接口以支持订单填写页面数据加载。"

- type: Backend
  id: API-POST-Orders
  route: POST /api/v1/orders
  description: 提交订单（占座）。
  input:
    type: JSON
    body:
      trainNo: string
      seatType: string
      passengers: [ { id, name, card_no } ]
  output:
    success:
      statusCode: 201
      body: { orderId: "uuid" }
    error:
      - statusCode: 409
        body: { error: "Not enough seats" }
  dependencies:
    - DB-CreateOrderTransaction
  acceptanceCriteria:
    - 执行核心交易，扣减库存。
    - 若 DB 抛出库存不足异常，返回 409。
  changeLog:
    - date: "2025-11-28"
      description: "初始创建。"

- type: Backend
  id: API-GET-Orders
  route: GET /api/v1/orders
  description: 获取我的订单列表。
  input:
    type: Query
    params:
      status: string (optional)
  output:
    success:
      statusCode: 200
      body: [ { orderId, status, tickets: [] } ]
  dependencies:
    - DB-FindOrdersByUser
  acceptanceCriteria:
    - 返回当前用户的订单。
  changeLog:
    - date: "2025-11-28"
      description: "初始创建。"

- type: Backend
  id: API-GET-OrderConfirmation
  route: GET /api/v1/orders/{id}/confirmation
  description: 获取订单确认信息（用于支付前核对）。
  input:
    type: None
  output:
    success:
      statusCode: 200
      body:
        trainInfo: object
        passengers: array
    error:
      - statusCode: 404
        body: { error: "Order not found" }
  dependencies:
    - DB-FindOrderById
  acceptanceCriteria:
    - 返回订单关联的车次和乘客信息。
  changeLog:
    - date: "2025-12-20"
      description: "接口实现完善：返回确认订单所需的完整车次和乘客信息。"
    - date: "2025-12-15"
      description: "新增接口以支持订单确认弹窗。"

- type: Backend
  id: API-POST-ConfirmOrder
  route: POST /api/v1/orders/{id}/confirm
  description: 确认订单（进入支付流程前）。
  input:
    type: None
  output:
    success:
      statusCode: 200
      body:
        trainInfo: object
        passengers: array
    error:
      - statusCode: 400
        body: { error: "Invalid order status" }
  dependencies:
    - DB-FindOrderById
  acceptanceCriteria:
    - 验证订单状态是否为 pending_payment。
  changeLog:
    - date: "2025-12-15"
      description: "新增接口以支持订单确认操作。"

- type: Backend
  id: API-GET-Payment
  route: GET /api/v1/orders/{id}/payment
  description: 获取支付页面详情。
  input:
    type: None
  output:
    success:
      statusCode: 200
      body:
        trainInfo: object
        passengers: array
        totalPrice: number
        timeRemaining: integer
    error:
      - statusCode: 400
        body: { error: "Order expired" }
  dependencies:
    - DB-FindOrderById
  acceptanceCriteria:
    - 返回支付所需的所有订单信息及剩余支付时间。
  changeLog:
    - date: "2025-12-20"
      description: "接口实现完善：包含支付倒计时和总价计算逻辑。"
    - date: "2025-12-15"
      description: "新增接口以支持支付页面渲染。"

- type: Backend
  id: API-POST-PayOrder
  route: POST /api/v1/orders/{id}/pay
  description: 支付订单。
  input:
    type: JSON
    body: { paymentMethod: string }
  output:
    success:
      statusCode: 200
      body: { status: "paid" }
    error:
      - statusCode: 400
        body: { error: "Order expired or invalid status" }
  dependencies:
    - DB-PayOrder
  acceptanceCriteria:
    - 仅能支付 pending_payment 且未过期的订单。
  changeLog:
    - date: "2025-12-20"
      description: "接口实现完善：包含支付状态检查及状态流转逻辑。"
    - date: "2025-11-28"
      description: "初始创建。"

- type: Backend
  id: API-POST-CancelOrder
  route: POST /api/v1/orders/{id}/cancel
  description: 取消未支付订单。
  input:
    type: None
  output:
    success:
      statusCode: 200
      body: { status: "canceled" }
  dependencies:
    - DB-CancelOrder
  acceptanceCriteria:
    - 仅能取消 pending_payment 的订单。
    - 触发库存释放。
  changeLog:
    - date: "2025-12-20"
      description: "接口实现完善：包含订单状态检查及取消逻辑。"
    - date: "2025-11-28"
      description: "初始创建。"

- type: Backend
  id: API-POST-RefundTicket
  route: POST /api/v1/tickets/{id}/refund
  description: 退订已支付的单张车票。
  input:
    type: None
  output:
    success:
      statusCode: 200
      body: { status: "refunded" }
  dependencies:
    - DB-RefundTicket
  acceptanceCriteria:
    - 仅能退订 active 状态的车票。
    - 触发库存释放。
  changeLog:
    - date: "2025-11-28"
      description: "初始创建。"
