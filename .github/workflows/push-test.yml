name: Run Tests on Push

on:
  push:
    branches:
      - db
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - '.gitignore'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Set up Docker Compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose

    - name: Start Database
      run: |
        docker-compose up -d
        # Wait for database to be ready
        echo "Waiting for database to initialize..."
        sleep 10
        # Use container name directly or get it from compose
        CONTAINER_NAME=$(docker-compose ps -q postgres)
        if [ -z "$CONTAINER_NAME" ]; then
          # Fallback to service name if ps -q fails or returns empty (depending on compose version)
          CONTAINER_NAME="railway12306-postgres"
        fi
        
        until docker exec $CONTAINER_NAME pg_isready -U postgres; do
          echo "Waiting for postgres..."
          sleep 2
        done

    - name: Run Tests
      working-directory: ./db
      run: go test -v ./...

    - name: Stop Database
      if: always()
      run: docker-compose down
